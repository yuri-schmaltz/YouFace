[tool.poetry]
name = "my-facefusion"
version = "3.9.1-my.1"
description = "Next-generation face manipulation application with decoupled architecture"
authors = ["Yuri Schmaltz <yurischmaltz@gmail.com>"]
readme = "README.md"
packages = [{include = "facefusion"}]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "2.2.1"
onnx = "1.21.0"
# onnxruntime is intentionally NOT pinned here: facefusion/installer.py
# selects the correct flavor (default/cuda@12/cuda@13/openvino/rocm/directml)
# at install time. Pinning here would cause a mismatch with the install
# script. See notes/upstream_divergence_2026-09-28.md for the rationale.
opencv-python = "4.13.0.92"
tqdm = "4.67.3"
scipy = "1.17.1"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = "^2.0.28"
python-multipart = "^0.0.9"
gradio = "5.44.1"
gradio-rangeslider = "0.0.8"
psutil = "^5.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
mypy = "^1.9.0"
flake8 = "^7.0.0"
httpx = "^0.27.0"  # used by tests/test_api_*.py for FastAPI TestClient

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
