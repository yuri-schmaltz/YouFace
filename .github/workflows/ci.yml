name: ci

on: [ push, pull_request ]

jobs:
 lint:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: pip install flake8
  - run: pip install flake8-import-order
  - run: pip install mypy
  - run: flake8 youface.py install.py
  - run: flake8 youface tests
  - run: mypy youface.py install.py
  - run: mypy youface tests
 frontend-check:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: 20
  - name: Install dependencies
    working-directory: ./frontend
    run: npm ci
  - name: Lint (eslint)
    working-directory: ./frontend
    run: npm run lint
  - name: TypeScript type-check
    working-directory: ./frontend
    run: npx --no-install tsc --noEmit
  - name: Build (next export)
    working-directory: ./frontend
    run: npm run build
  - name: Upload frontend/out as artifact
    uses: actions/upload-artifact@v4
    with:
      name: frontend-out
      path: frontend/out
      if-no-files-found: warn
 test:
  strategy:
   matrix:
    os: [ macos-latest, ubuntu-latest, windows-latest ]
  runs-on: ${{ matrix.os }}
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up FFmpeg
    uses: AnimMouse/setup-ffmpeg@v1
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: python install.py default --skip-conda
  # Garantir deps do fork (FastAPI/uvicorn/sqlalchemy) que o install.py
  # oficial pode nao trazer dependendo da politica de pin.
  - run: pip install fastapi 'uvicorn[standard]' sqlalchemy python-multipart psutil httpx pytest
  - run: pytest
 api-tests:
  needs: [ test, frontend-check ]
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: pip install -r requirements.txt
  - run: pip install pytest httpx
  - name: API endpoint tests
    run: pytest tests/test_api_endpoints.py tests/test_api_face_mapping.py -v --no-header
  - name: API worker test (smoke)
    run: pytest tests/test_api_worker.py -v --no-header
  - name: Upload API test results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: api-test-results
      path: |
        *.xml
        .pytest_cache
      if-no-files-found: ignore
 report:
  needs: test
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up FFmpeg
    uses: AnimMouse/setup-ffmpeg@v1
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: python install.py default --skip-conda
  - run: pip install coveralls
  - run: pip install pytest
  - run: pip install pytest-cov
  - run: pip install fastapi 'uvicorn[standard]' sqlalchemy python-multipart psutil httpx
  - run: pytest tests --cov youface
  - run: coveralls --service github
    env:
     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 e2e:
  needs: [ test, frontend-check, api-tests ]
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: pip install -r requirements.txt
  - run: pip install playwright
  - name: Set up Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: 20
  - name: Install frontend deps (with Playwright)
    working-directory: ./frontend
    run: npm ci
  - name: Install Playwright browsers
    run: playwright install --with-deps chromium
  - name: Boot backend in background
    run: |
      python run_api.py &
      sleep 8
      curl -fsS http://127.0.0.1:8000/api/hardware/devices || (echo "Backend failed to boot"; exit 1)
  - name: Run Playwright smoke
    working-directory: ./frontend
    run: npx playwright test --reporter=list
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
  - name: Upload Playwright report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playwright-report
      path: frontend/playwright-report
      if-no-files-found: warn
