name: ci

on: [ push, pull_request ]

jobs:
 lint:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: pip install flake8
  - run: pip install flake8-import-order
  - run: pip install mypy
  - run: flake8 facefusion.py install.py
  - run: flake8 facefusion tests
  - run: mypy facefusion.py install.py
  - run: mypy facefusion tests
 frontend-check:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: 20
  - name: Install dependencies
    working-directory: ./frontend
    run: npm ci
  - name: Lint (eslint)
    working-directory: ./frontend
    run: npm run lint
  - name: TypeScript type-check
    working-directory: ./frontend
    run: npx --no-install tsc --noEmit
  - name: Build (next export)
    working-directory: ./frontend
    run: npm run build
  - name: Upload frontend/out as artifact
    uses: actions/upload-artifact@v4
    with:
      name: frontend-out
      path: frontend/out
      if-no-files-found: warn
 test:
  strategy:
   matrix:
    os: [ macos-latest, ubuntu-latest, windows-latest ]
  runs-on: ${{ matrix.os }}
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up FFmpeg
    uses: AnimMouse/setup-ffmpeg@v1
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: python install.py default --skip-conda
  # Garantir deps do fork (FastAPI/uvicorn/sqlalchemy) que o install.py
  # oficial pode nao trazer dependendo da politica de pin.
  - run: pip install fastapi 'uvicorn[standard]' sqlalchemy python-multipart psutil httpx pytest
  - run: pytest
 report:
  needs: test
  runs-on: ubuntu-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up FFmpeg
    uses: AnimMouse/setup-ffmpeg@v1
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - run: python install.py default --skip-conda
  - run: pip install coveralls
  - run: pip install pytest
  - run: pip install pytest-cov
  - run: pip install fastapi 'uvicorn[standard]' sqlalchemy python-multipart psutil httpx
  - run: pytest tests --cov facefusion
  - run: coveralls --service github
    env:
     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
